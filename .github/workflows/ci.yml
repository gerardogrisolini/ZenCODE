name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Live provider suites are opt-in via ZENCODE_RUN_LIVE_* and must stay off in
  # ordinary CI. See Docs/release.md and Tests/.../Live.
  ZENCODE_RUN_LIVE_FEATURE_E2E: "0"

jobs:
  feature-matrix:
    name: Generate standalone feature matrix
    runs-on: macos-26
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Generate matrix from the distribution catalog
        id: matrix
        run: |
          set -euo pipefail
          swiftc \
            Sources/ZenPackageMetadata/ZenBundledFeatureCatalog.swift \
            Scripts/FeatureCIMatrix.swift \
            -o "$RUNNER_TEMP/feature-ci-matrix"
          matrix="$($RUNNER_TEMP/feature-ci-matrix)"
          printf '%s\n' "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  standalone-features:
    name: ${{ matrix.feature }} (${{ matrix.platform }})
    needs: feature-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.feature-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || null }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Show toolchain
        run: swift --version
      - name: Mark workspace as a safe Git directory
        if: matrix.container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Resolve from the standalone lockfile
        run: |
          swift package --package-path "${{ matrix.packagePath }}" resolve --only-use-versions-from-resolved-file
          git diff --exit-code -- "${{ matrix.packagePath }}/Package.resolved"
      - name: Test standalone package
        shell: bash
        run: |
          set -euo pipefail
          package_path="${{ matrix.packagePath }}"
          description="$(swift package --package-path "$package_path" describe --type json)"
          has_test_targets="$(
          PACKAGE_DESCRIPTION="$description" swift - <<'SWIFT'
          import Foundation

          let data = Data(ProcessInfo.processInfo.environment["PACKAGE_DESCRIPTION", default: ""].utf8)
          guard let package = try JSONSerialization.jsonObject(with: data) as? [String: Any],
                let targets = package["targets"] as? [[String: Any]] else {
              fatalError("package description must contain a targets array")
          }
          print(targets.contains { $0["type"] as? String == "test" } ? "true" : "false")
          SWIFT
          )"
          if [[ "$has_test_targets" == "true" ]]; then
            swift test --package-path "$package_path"
          elif [[ "$has_test_targets" == "false" ]]; then
            echo "No test target declared for $package_path; skipping swift test."
          else
            echo "Unexpected test-target detection result: $has_test_targets" >&2
            exit 1
          fi
      - name: Build standalone executable
        run: swift build -c release --package-path "${{ matrix.packagePath }}" --product "${{ matrix.product }}"
      - name: Validate --list-tools schema
        shell: bash
        run: |
          set -euo pipefail
          output="$(swift run -c release --package-path "${{ matrix.packagePath }}" "${{ matrix.product }}" --list-tools)"
          printf '%s\n' "$output"
          LIST_TOOLS_OUTPUT="$output" swift - <<'SWIFT'
          import Foundation
          let data = Data(ProcessInfo.processInfo.environment["LIST_TOOLS_OUTPUT", default: ""].utf8)
          guard let payload = try JSONSerialization.jsonObject(with: data) as? [String: Any],
                let tools = payload["tools"] as? [[String: Any]] else {
              fatalError("top-level tools must be an array")
          }
          for tool in tools {
              guard let name = tool["name"] as? String, !name.isEmpty,
                    tool["description"] is String else {
                  fatalError("each tool requires name and description")
              }
              if let schema = tool["inputSchema"] as? String {
                  _ = try JSONSerialization.jsonObject(with: Data(schema.utf8))
              } else if !(tool["inputSchema"] is [String: Any]) {
                  fatalError("tool.inputSchema must be JSON or a JSON string")
              }
          }
          SWIFT

  macos:
    name: macOS 26 (Swift 6.3)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version || true

      - name: Cache SwiftPM build products
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-macos-26-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-macos-26-

      - name: Assert live provider suites are disabled
        run: |
          if [ "${ZENCODE_RUN_LIVE_FEATURE_E2E:-0}" = "1" ]; then
            echo "::error::Live provider E2E must not run in CI."
            exit 1
          fi
          echo "Live provider suites disabled."

      - name: Resolve dependencies from the immutable lockfile
        run: |
          swift package resolve --only-use-versions-from-resolved-file
          # CI consumes Package.resolved, it never updates it. A drifting
          # lockfile must be an explicit, reviewed commit.
          if ! git diff --exit-code -- Package.resolved; then
            echo "::error::Package.resolved is out of date. Run 'swift package resolve' and commit the result."
            exit 1
          fi

      - name: Build shared runtime
        run: swift build --target ZenCODECore

      - name: Test
        # Several lifecycle suites intentionally exercise Foundation.Process,
        # whose exit coordination and signal state are process-global. Running
        # cases concurrently can park that shared manager and cascade timeouts.
        run: swift test --no-parallel

      - name: Build release product
        run: swift build -c release --product zen

      - name: Strip release binary
        shell: bash
        run: |
          set -euo pipefail
          strip -u -r .build/release/zen

      - name: Verify release binary
        run: .build/release/zen --version

      - name: Smoke test macOS installer
        run: |
          smoke_root="$RUNNER_TEMP/zencode-installer-smoke"
          INSTALL_DIR="$smoke_root/bin" \
          ZENCODE_SUPPORT_DIRECTORY="$smoke_root/support" \
            Scripts/install.sh --debug --prefix "$smoke_root/bin"
          "$smoke_root/bin/zen" --version

      - name: Check shell syntax
        run: bash -n Scripts/*.sh

      - name: Check whitespace errors
        run: git diff --check

      - name: Package downloadable build
        run: |
          set -euo pipefail
          archive="zen-${GITHUB_SHA}-macos-arm64.tar.gz"
          mkdir -p artifacts
          tar -C .build/release -czf "artifacts/$archive" zen
          (
            cd artifacts
            shasum -a 256 "$archive" > "$archive.sha256"
          )

      - name: Upload downloadable build
        uses: actions/upload-artifact@v7
        with:
          name: zen-${{ github.sha }}-macos-arm64
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true

  linux:
    name: Ubuntu 24.04 ${{ matrix.arch }} (Swift 6.3)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
            platform: linux-x86_64
          - arch: arm64
            os: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    container: swift:6.3-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show toolchain
        run: swift --version

      - name: Mark workspace as a safe Git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache SwiftPM build products
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-ubuntu-24.04-${{ matrix.arch }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-ubuntu-24.04-${{ matrix.arch }}-

      - name: Assert live provider suites are disabled
        run: |
          if [ "${ZENCODE_RUN_LIVE_FEATURE_E2E:-0}" = "1" ]; then
            echo "::error::Live provider E2E must not run in CI."
            exit 1
          fi
          echo "Live provider suites disabled."

      - name: Resolve dependencies from the immutable lockfile
        run: |
          swift package resolve --only-use-versions-from-resolved-file
          if ! git diff --exit-code -- Package.resolved; then
            echo "::error::Package.resolved is out of date. Run 'swift package resolve' and commit the result."
            exit 1
          fi

      - name: Build shared runtime
        run: swift build --target ZenCODECore

      - name: Test
        # Match macOS: deterministic process lifecycle coverage is more valuable
        # here than case-level parallelism, which can poison Foundation's shared
        # process manager and leave the test step waiting until the job timeout.
        run: swift test --no-parallel

      - name: Build release product
        run: swift build -c release --product zen

      - name: Strip release binary
        shell: bash
        run: |
          set -euo pipefail
          strip --strip-all .build/release/zen

      - name: Verify release binary
        run: .build/release/zen --version

      - name: Smoke test Linux/WSL installer path
        if: matrix.arch == 'x86_64'
        run: |
          smoke_root="$RUNNER_TEMP/zencode-installer-smoke"
          INSTALL_DIR="$smoke_root/bin" \
          ZENCODE_SUPPORT_DIRECTORY="$smoke_root/support" \
            Scripts/install-linux.sh --debug --prefix "$smoke_root/bin"
          "$smoke_root/bin/zen" --version

      - name: Check shell syntax
        run: bash -n Scripts/*.sh

      - name: Check whitespace errors
        run: git diff --check

      - name: Package downloadable build
        shell: bash
        run: |
          set -euo pipefail
          archive="zen-${GITHUB_SHA}-${{ matrix.platform }}.tar.gz"
          mkdir -p artifacts
          tar -C .build/release -czf "artifacts/$archive" zen
          (
            cd artifacts
            sha256sum "$archive" > "$archive.sha256"
          )

      - name: Upload downloadable build
        uses: actions/upload-artifact@v7
        with:
          name: zen-${{ github.sha }}-${{ matrix.platform }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true
