name: Release

# Verifies a release tag, builds downloadable archives, and publishes them to
# the matching GitHub Release only after every platform gate succeeds.
#
# GitHub only accepts a broad tag glob here, so the workflow matches `v*` and
# then enforces the strict `vX.Y.Z` contract from Docs/release.md, requiring the
# tag to match ZenPackageMetadata.version.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to verify (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify tag contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.contract.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Enforce strict vX.Y.Z tag and version match
        id: contract
        run: |
          set -euo pipefail

          raw_ref="${{ inputs.ref || github.ref_name }}"

          if ! printf '%s' "$raw_ref" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$raw_ref' does not match the strict vX.Y.Z release contract (Docs/release.md)."
            exit 1
          fi

          tag_version="${raw_ref#v}"

          metadata_version="$(
            sed -n 's/.*static let version = "\([^"]*\)".*/\1/p' \
              Sources/ZenPackageMetadata/ZenPackageMetadata.swift
          )"

          if [ -z "$metadata_version" ]; then
            echo "::error::Could not read ZenPackageMetadata.version."
            exit 1
          fi

          if [ "$tag_version" != "$metadata_version" ]; then
            echo "::error::Tag version '$tag_version' does not match ZenPackageMetadata.version '$metadata_version'."
            exit 1
          fi

          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
          echo "Verified release tag $raw_ref against ZenPackageMetadata.version $metadata_version."

  release-gate:
    name: Release gate (${{ matrix.name }})
    needs: verify-tag
    # The gate always builds from a clean checkout without the CI build cache, so
    # it needs more headroom than the cached CI jobs.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 26
            os: macos-26
            container: ""
            platform: macos-arm64
          - name: Ubuntu 24.04
            os: ubuntu-24.04
            container: swift:6.3-noble
            platform: linux-x86_64
          - name: Ubuntu 24.04 ARM64
            os: ubuntu-24.04-arm
            container: swift:6.3-noble
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || null }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Mark workspace as a safe Git directory
        if: matrix.container != ''
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Show toolchain
        run: swift --version

      - name: Resolve dependencies from the immutable lockfile
        run: |
          swift package resolve --only-use-versions-from-resolved-file
          git diff --exit-code -- Package.resolved

      - name: Build shared runtime
        run: swift build --target ZenCODECore

      - name: Test
        # Must match CI: several lifecycle suites exercise Foundation.Process,
        # whose exit coordination and signal state are process-global. Running
        # cases concurrently can park that shared manager and cascade timeouts,
        # stalling this step until the job timeout and skipping the packaging
        # and publishing steps below.
        run: swift test --no-parallel

      - name: Build release product
        run: swift build -c release --product zen

      - name: Strip release binary
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -s)" = "Darwin" ]; then
            # -u -r is the maximum stripping level for a dynamically linked
            # executable: it keeps only undefined symbols and symbols referenced
            # dynamically. See strip(1).
            strip -u -r .build/release/zen
          else
            strip --strip-all .build/release/zen
          fi

      - name: Verify reported version matches the tag
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ needs.verify-tag.outputs.version }}"
          reported="$(.build/release/zen --version)"
          echo "zen --version: $reported"
          if ! printf '%s' "$reported" | grep -Fq "$expected"; then
            echo "::error::Release binary reported '$reported', expected version '$expected'."
            exit 1
          fi

      - name: Check shell syntax
        run: bash -n Scripts/*.sh

      - name: Check whitespace errors
        run: git diff --check

      - name: Package release archive
        shell: bash
        run: |
          set -euo pipefail
          archive="zen-${{ needs.verify-tag.outputs.version }}-${{ matrix.platform }}.tar.gz"
          mkdir -p artifacts
          tar -C .build/release -czf "artifacts/$archive" zen
          (
            cd artifacts
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$archive" > "$archive.sha256"
            else
              shasum -a 256 "$archive" > "$archive.sha256"
            fi
          )

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: zen-${{ needs.verify-tag.outputs.version }}-${{ matrix.platform }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: true

  publish-release:
    name: Publish downloadable release
    needs: [verify-tag, release-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release archives
        uses: actions/download-artifact@v8
        with:
          pattern: zen-${{ needs.verify-tag.outputs.version }}-*
          path: artifacts
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          tag="v${VERSION}"
          assets=(artifacts/*.tar.gz artifacts/*.sha256)
          expected_assets=(
            "artifacts/zen-${VERSION}-macos-arm64.tar.gz"
            "artifacts/zen-${VERSION}-macos-arm64.tar.gz.sha256"
            "artifacts/zen-${VERSION}-linux-x86_64.tar.gz"
            "artifacts/zen-${VERSION}-linux-x86_64.tar.gz.sha256"
            "artifacts/zen-${VERSION}-linux-arm64.tar.gz"
            "artifacts/zen-${VERSION}-linux-arm64.tar.gz.sha256"
          )

          if [ "${#assets[@]}" -ne "${#expected_assets[@]}" ]; then
            echo "::error::Expected three release archives and three checksums, found ${#assets[@]}."
            printf 'Found: %s\n' "${assets[@]}"
            exit 1
          fi

          for asset in "${expected_assets[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "::error::Missing expected release asset: $asset"
              exit 1
            fi
          done

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${expected_assets[@]}" --clobber
          else
            gh release create "$tag" "${expected_assets[@]}" \
              --verify-tag \
              --title "ZenCODE $tag" \
              --generate-notes
          fi
